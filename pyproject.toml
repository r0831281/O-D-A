[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-control"
version = "0.1.0"
description = "Local-first NEXUS control-plane foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.138.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.0.55",
  "alembic==1.20.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
